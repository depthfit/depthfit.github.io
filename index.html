<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三川流域誌 - 經濟部水利署第三河川分署</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <!-- Full-bleed background layer -->
    <div class="home-bg-container">
        <div class="home-bg-image"></div>
    </div>

    <!-- Header Navigation -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html" class="logo-link" aria-label="三川流域誌首頁">
                <img src="assets/v2/logo_header.png" alt="經濟部水利署 第三河川分署" class="header-logo-img">
            </a>
        </div>
        
        <button class="hamburger" aria-label="切換選單">
            <i class="fas fa-bars"></i>
        </button>

        <nav class="main-nav">
            <a href="#" class="nav-link">關於三川</a>
            <a href="inner.html" class="nav-link">流域故事</a>
            <a href="#" class="nav-link">生態圖鑑</a>
            <a href="#" class="nav-link">守溪行動</a>
            <a href="#" class="nav-link">聯絡我們</a>
            <a href="#" class="lang-btn">EN</a>
        </nav>
    </header>

    <!-- Main Hero -->
    <main class="hero-container">
        <!-- Hero Title Banner with Wave & Subtitle -->
        <section class="hero-banner-section">
            <div class="hero-title-wrapper">
                <img src="assets/v2/home_title.png" alt="三川流域誌 - 記錄三川 · 人與河的故事 - 大甲溪 · 大安溪 · 烏溪" class="home-title-img">
            </div>
        </section>

        <!-- Journals Section (三川流域之四誌) -->
        <section class="journals-section">
            <!-- Badge: 三川流域之四誌 -->
            <div class="section-badge-container">
                <div class="section-badge">
                    <img src="assets/v2/home_badge.png" alt="三川流域之四誌" class="badge-img">
                </div>
            </div>
            
            <!-- 4 Cards Grid -->
            <div class="cards-container">
                <!-- 01 流域故事誌 -->
                <a href="inner.html" class="journal-card" aria-label="01 流域故事誌">
                    <img src="assets/v2/card_01_story.png" alt="01 流域故事誌 - 循著大甲溪、大安溪與烏溪，探索聚落發展、水文化歷史及人與河川共生的流域故事。" class="journal-card-img">
                </a>

                <!-- 02 守溪行動誌 -->
                <a href="inner.html" class="journal-card" aria-label="02 守溪行動誌">
                    <img src="assets/v2/card_02_action.png" alt="02 守溪行動誌 - 介紹流域生態環境與生物多樣性，記錄珍貴物種與棲地，守護自然的永續未來。" class="journal-card-img">
                </a>

                <!-- 03 三川生態誌 -->
                <a href="inner.html" class="journal-card" aria-label="03 三川生態誌">
                    <img src="assets/v2/card_03_eco.png" alt="03 三川生態誌 - 記錄守護河川的行動與力量，展現志工、社區與民眾共同守護家園的成果。" class="journal-card-img">
                </a>

                <!-- 04 公私協力誌 -->
                <a href="inner.html" class="journal-card" aria-label="04 公私協力誌">
                    <img src="assets/v2/card_04_collab.png" alt="04 公私協力誌 - 記錄公私協力合作成果，串聯企業、社區與民間力量，共創流域永續價值。" class="journal-card-img">
                </a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
